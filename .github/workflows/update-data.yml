name: Update catalog data

on:
  schedule:
    - cron: '0 3 * * *'  # codziennie 3:00 UTC (5:00 PL) — mniejszy ruch na fal.ai
  workflow_dispatch:      # ręczny trigger z UI GitHub

permissions:
  contents: write
  actions: write  # do `gh workflow run deploy.yml` po pushu (GITHUB_TOKEN nie triggeruje push-driven workflowów)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup SSH (mikrus)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Fetch fal.ai via mikrus
        run: |
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          SCP="scp -P ${{ secrets.DEPLOY_PORT }}"
          if $SCP scripts/fetch-fal.py ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/fetch-fal.py \
            && $SSH 'python3 /tmp/fetch-fal.py /tmp/fal-raw.json' \
            && $SCP ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/fal-raw.json data/fal-raw.json; then
            echo "FAL_PREFETCHED=1" >> $GITHUB_ENV
          else
            echo "⚠ fal.ai SSH fetch failed — update script will try directly (likely 429)"
          fi

      - name: Run update script
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
        run: bash scripts/update-litellm.sh

      - name: Notify ntfy on degraded sources
        if: always()
        run: |
          DEGRADED=""
          if [ -f data/_source-health.json ]; then
            DEGRADED=$(jq -r '.degraded[]? | "\(.source) \(.fresh)/\(.last_good)"' data/_source-health.json | paste -sd ", " -)
          fi
          FAILED=""
          if [ -f data/_fetch-failures.txt ]; then
            FAILED=$(paste -sd ", " data/_fetch-failures.txt)
          fi
          if [ -z "$DEGRADED" ] && [ -z "$FAILED" ]; then
            echo "✓ Wszystkie źródła zdrowe — brak alertu."
            exit 0
          fi
          MSG="Katalog zaktualizowany, ale użyto last-good dla zdegradowanych źródeł — wymagają naprawy."
          [ -n "$DEGRADED" ] && MSG="$MSG"$'\n'"Skurczyły się (fresh/last-good): $DEGRADED"
          [ -n "$FAILED" ]   && MSG="$MSG"$'\n'"Fetch padł (stale cache): $FAILED"
          MSG="$MSG"$'\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
               -H "Title: aiapi — źródło wymaga naprawy" \
               -H "Priority: default" \
               -H "Tags: warning,wrench" \
               -d "$MSG" \
               https://ntfy.szepiet.ovh/alerts-da13b58d3e16

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update catalog data $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Notify ntfy on failure
        if: failure()
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
               -H "Title: aiapi update-data FAILED" \
               -H "Priority: high" \
               -H "Tags: warning,robot" \
               -d "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               https://ntfy.szepiet.ovh/alerts-da13b58d3e16
