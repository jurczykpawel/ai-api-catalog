name: Deploy to Cloudflare Pages (aiapi.techskills.academy)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust data URLs in index.html
        run: |
          V=$(date -u +%Y%m%d%H%M)
          sed -i "s|fetch('data/\([^']*\)')|fetch('data/\1?v=$V')|g" index.html
          echo "Cache-bust version: $V"
          grep -o "fetch('data/[^']*')" index.html | head -5

      - name: Prepare dist (exclude oversized raw scrape files)
        # CF Pages 25 MiB per-file limit. *-raw.json są intermediate dane scrapingu,
        # nie referowane przez index.html — wystarczą {categories,models,providers}.json.
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.pre-commit-config.yaml' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='data/*-raw.json' \
            --exclude='data/models-snapshot.json' \
            --exclude='data/models-index.json' \
            --exclude='data/models-manual.json' \
            ./ dist/
          du -sh dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aiapi-techskills-academy --branch=main

      - name: Smoke test
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 https://aiapi.techskills.academy)
          test "$code" = "200" || (echo "FAIL: HTTP $code" && exit 1)
          echo "OK: aiapi.techskills.academy -> $code"
